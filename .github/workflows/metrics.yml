name: Generate Profile Metrics

on:
  # Run once every Sunday at midnight UTC
  schedule:
    - cron: "0 0 * * 0"

  # Allow manual generation from Actions
  workflow_dispatch:

  # Regenerate when this workflow itself changes
  push:
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: assets/metrics.svg

          # ------------------------------------------------------------
          # BASIC PROFILE INFORMATION
          # ------------------------------------------------------------
          base: header, activity, community, repositories, metadata

          # ------------------------------------------------------------
          # MOST USED LANGUAGES
          # Includes repositories accessible by METRICS_TOKEN
          # ------------------------------------------------------------
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 5
          plugin_languages_details: bytes-size, percentage

          # ------------------------------------------------------------
          # CONTRIBUTION CALENDAR
          # ------------------------------------------------------------
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # ------------------------------------------------------------
          # RECENT GITHUB ACTIVITY
          # ------------------------------------------------------------
          plugin_activity: yes
          plugin_activity_limit: 6

          # ------------------------------------------------------------
          # DO NOT FAIL THE WHOLE WORKFLOW IF A PLUGIN HAS
          # INSUFFICIENT PERMISSIONS
          # ------------------------------------------------------------
          plugins_errors_fatal: no
