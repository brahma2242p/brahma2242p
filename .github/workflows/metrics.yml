name: Generate Profile Metrics

on:
  # Run once every Sunday at midnight UTC
  schedule:
    - cron: "0 0 * * 0"

  # Allow manual execution
  workflow_dispatch:

  # Run when this workflow is changed
  push:
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    # Prevent an unexpected hang from running forever
    timeout-minutes: 15

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@v3.34

        with:
          # GitHub PAT stored securely in repository secrets
          token: ${{ secrets.METRICS_TOKEN }}

          # Output file
          filename: assets/metrics.svg

          # ==========================================================
          # BASE PROFILE INFORMATION
          # ==========================================================
          base: header, activity, community, repositories, metadata

          # ==========================================================
          # MOST USED LANGUAGES
          # Includes repositories accessible through METRICS_TOKEN
          # ==========================================================
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 5
          plugin_languages_details: bytes-size, percentage

          # ==========================================================
          # CURRENT-YEAR CONTRIBUTION CALENDAR
          # ==========================================================
          plugin_calendar: yes

          # ==========================================================
          # ERROR HANDLING
          # Don't fail the entire render if a non-critical plugin
          # encounters an API/permission issue
          # ==========================================================
          plugins_errors_fatal: no
